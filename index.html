
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Go Exchanger | Global Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050b18;
            --card-bg: #161b2c;
            --primary: #00d084;
            --tab-inactive: #2d3748;
            --text-main: #ffffff;
            --text-dim: #a0aec0;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* --- Effet Étoiles Animées --- */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #050b18 100%);
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* --- Mise en page --- */
        .app-container {
            max-width: 500px;
            margin: 30px auto;
            padding: 0 15px;
            text-align: center;
        }

        .logo-text {
            font-size: 38px;
            font-weight: 800;
            background: linear-gradient(135deg, #00d084 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            letter-spacing: -2px;
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .tab.active { background: var(--primary); color: #050b18; }
        .tab.inactive { background: var(--tab-inactive); color: var(--text-dim); }

        .widget-wrapper {
            background: var(--card-bg);
            border-radius: 30px;
            padding: 8px;
            box-shadow: 0 0 40px rgba(0, 208, 132, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-height: 650px;
        }

        iframe {
            width: 100%;
            height: 650px;
            border: none;
            border-radius: 24px;
        }

        /* --- Carrousel de Logos Défilants --- */
        .payment-slider {
            width: 100%;
            overflow: hidden;
            margin: 25px 0;
            background: rgba(255, 255, 255, 0.03);
            padding: 15px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .slider-track {
            display: flex;
            width: calc(250px * 8);
            animation: scroll 20s linear infinite;
        }

        .logo-item {
            width: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
        }

        .logo-item img {
            max-width: 80px;
            max-height: 30px;
            filter: grayscale(100%) brightness(200%);
            opacity: 0.7;
        }

        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(-120px * 4)); }
        }

        footer {
            font-size: 11px;
            color: var(--text-dim);
            padding-bottom: 40px;
        }
    </style>
</head>
<body>

    <div class="stars-container" id="stars"></div>

    <div class="app-container">
        <header>
            <h1 class="logo-text">Go Exchanger</h1>
            <div class="nav-tabs">
                <div class="tab active">Achat Fiat 💳</div>
                <div class="tab inactive">Swap Crypto 🔄</div>
            </div>
        </header>

        <main class="widget-wrapper">
            <iframe 
                id='iframe-widget' 
                src='https://changenow.io/embeds/exchange-widget/v2/widget.html?FAQ=true&amount=100&amountFiat=100&backgroundColor=FFFFFF&darkMode=false&from=eur&fromFiat=eur&horizontal=false&isFiat=true&lang=fr-FR&link_id=8c77efcb70ab45&locales=true&logo=true&primaryColor=00C26F&to=btc&toFiat=btc&toTheMoon=true'
                title="Go Exchanger Pro">
            </iframe>
        </main>

        <div class="payment-slider">
            <div class="slider-track">
                <div class="logo-item"><img src="https://upload.wikimedia.org/wikipedia/commons/5/5e/Visa_Inc._logo.svg" alt="Visa"></div>
                <div class="logo-item"><img src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Mastercard-logo.svg" alt="Mastercard"></div>
                <div class="logo-item"><img src="https://upload.wikimedia.org/wikipedia/commons/b/b0/Apple_Pay_logo.svg" alt="Apple Pay"></div>
                <div class="logo-item"><img src="https://upload.wikimedia.org/wikipedia/commons/c/c7/Google_Pay_Logo_%282020%29.svg" alt="Google Pay"></div>
                <div class="logo-item"><img src="https://upload.wikimedia.org/wikipedia/commons/5/5e/Visa_Inc._logo.svg" alt="Visa"></div>
                <div class="logo-item"><img src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Mastercard-logo.svg" alt="Mastercard"></div>
                <div class="logo-item"><img src="https://upload.wikimedia.org/wikipedia/commons/b/b0/Apple_Pay_logo.svg" alt="Apple Pay"></div>
                <div class="logo-item"><img src="https://upload.wikimedia.org/wikipedia/commons/c/c7/Google_Pay_Logo_%282020%29.svg" alt="Google Pay"></div>
            </div>
        </div>

        <footer>
            <p>🔒 Sécurité de grade militaire • Support 24/7<br>
            Plus de 900 actifs disponibles pour le monde entier.<br>
            © 2026 Go Exchanger - International Crypto Gateway</p>
        </footer>
    </div>

    <script>
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 80; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const x = Math.random() * 100;
            const y = Math.random() * 100;
            const duration = 2 + Math.random() * 4;
            star.style.left = `${x}%`;
            star.style.top = `${y}%`;
            star.style.width = `1.5px`;
            star.style.height = `1.5px`;
            star.style.setProperty('--duration', `${duration}s`);
            starsContainer.appendChild(star);
        }
    </script>
    <script defer src='https://changenow.io/embeds/exchange-widget/v2/stepper-connector.js'></script>
</body>
</html>
