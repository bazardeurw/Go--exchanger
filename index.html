
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Go Exchanger | Global Crypto Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f1a;
            --card-bg: #161b2c;
            --primary: #00d084;
            --accent: #3b82f6;
            --text-main: #ffffff;
            --text-dim: #94a3b8;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 50% 0%, #1e293b, #0b0f1a);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            animation: fadeIn 0.8s ease-in-out;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-text {
            font-size: 38px;
            font-weight: 800;
            background: linear-gradient(135deg, #00d084 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            letter-spacing: -1.5px;
        }

        .status-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .badge {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(0, 208, 132, 0.1);
            color: var(--primary);
            border: 1px solid rgba(0, 208, 132, 0.2);
            text-transform: uppercase;
            font-weight: 600;
        }

        .widget-wrapper {
            background: var(--card-bg);
            border-radius: 28px;
            padding: 6px;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            min-height: 650px;
        }

        iframe {
            width: 100%;
            height: 650px;
            border: none;
            border-radius: 22px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 25px;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 5px;
            border-radius: 12px;
            text-align: center;
            font-size: 11px;
            color: var(--text-dim);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .info-card strong {
            display: block;
            color: white;
            margin-bottom: 4px;
            font-size: 12px;
        }

        footer {
            margin-top: 30px;
            text-align: center;
            font-size: 12px;
            color: var(--text-dim);
            line-height: 1.6;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1 class="logo-text">Go Exchanger</h1>
            <div class="status-bar">
                <span class="badge">Achat Fiat 💳</span>
                <span class="badge">Swap Crypto 🔄</span>
                <span class="badge">Global 🌍</span>
            </div>
        </header>

        <main class="widget-wrapper">
            <iframe 
                id='iframe-widget' 
                src='https://changenow.io/embeds/exchange-widget/v2/widget.html?FAQ=true&amount=0.1&amountFiat=100&backgroundColor=FFFFFF&darkMode=false&from=btc&fromFiat=eur&horizontal=false&isFiat=true&lang=fr-FR&link_id=8c77efcb70ab45&locales=true&logo=true&primaryColor=00C26F&to=eth&toFiat=btc&toTheMoon=true'
                title="Go Exchanger Universal Interface">
            </iframe>
        </main>

        <div class="info-grid">
            <div class="info-card">
                <strong>+900 Assets</strong>
                Disponibles
            </div>
            <div class="info-card">
                <strong>No Limits</strong>
                Échanges illimités
            </div>
            <div class="info-card">
                <strong>Non-Custodial</strong>
                Sécurité maximale
            </div>
        </div>

        <footer>
            <p>Support mondial 24/7 • Partenaire officiel ChangeNOW<br>
            Visa, MasterCard, Apple Pay & Google Pay acceptés.<br>
            <strong>&copy; 2026 Go Exchanger - International Crypto Gateway</strong></p>
        </footer>
    </div>

    <script defer src='https://changenow.io/embeds/exchange-widget/v2/stepper-connector.js'></script>
</body>
</html>
